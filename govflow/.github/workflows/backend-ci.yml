# GovFlow AI — backend CI (Track A)
#
# Runs the Phase 0 quality gates on every push/PR:
#   lint        -> ruff check + format check
#   typecheck   -> mypy (app)
#   test        -> pytest against PostgreSQL + Redis services
#   migrate     -> alembic upgrade head against the services
name: backend-ci

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/services/**"
      - "packages/applications/**"
      - "packages/grievances/**"
      - "packages/audit/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/services/**"
      - "packages/applications/**"
      - "packages/grievances/**"
      - "packages/audit/**"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: apps/api
        run: |
          python -m ruff check app tests alembic
          python -m ruff format --check app tests alembic
      - name: Typecheck (mypy)
        working-directory: apps/api
        run: python -m mypy app

  test-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: govflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/govflow
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: ci
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Migrate
        working-directory: apps/api
        run: python -m alembic upgrade head
      - name: Test
        working-directory: apps/api
        run: python -m pytest --cov=app --cov-report=term-missing -q